<!DOCTYPE html>
<html>
<head>
    <title>معلومات النظام</title>
    <style>
        body { 
            font-family: Arial; 
            background: #0d0d0d; 
            color: #fff; 
            padding: 20px; 
            max-width: 900px;
            margin: 0 auto;
        }
        h1 { color: #00e676; text-align: center; border-bottom: 2px solid #00e676; padding-bottom: 15px; }
        .status { text-align: center; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .online { color: #00e676; background: #1a2a1a; }
        .offline { color: #ff5252; background: #2a1a1a; }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
        }
        .btn-green { background: #00e676; color: #000; }
        .btn-blue { background: #2196F3; color: #fff; }
        .btn-red { background: #ff5252; color: #fff; }
        .card {
            background: #1a1a2e;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            border: 1px solid #333;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .item {
            background: #111;
            padding: 10px;
            border-radius: 5px;
        }
        .item .label { color: #888; font-size: 12px; text-transform: uppercase; }
        .item .value { color: #fff; font-size: 14px; margin-top: 5px; word-break: break-all; }
        .debug {
            background: #0a0a0a;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 11px;
            color: #888;
            max-height: 200px;
            overflow: auto;
            white-space: pre-wrap;
        }
        .controls { text-align: center; margin: 15px 0; }
        .token-input {
            padding: 8px 15px;
            background: #1a1a2e;
            border: 1px solid #333;
            color: #fff;
            border-radius: 5px;
            width: 180px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>🖥️ معلومات النظام</h1>
    
    <div class="controls">
        <input type="password" id="tokenInput" class="token-input" value="medo123" placeholder="التوكن">
        <button class="btn btn-green" onclick="loadData()">🔄 تحديث</button>
        <button class="btn btn-blue" onclick="sendTest()">🧪 اختبار</button>
        <button class="btn btn-red" onclick="clearData()">🗑️ مسح</button>
    </div>

    <div id="status" class="status offline">⛔ غير متصل</div>

    <div id="dataContainer">
        <div class="card" style="text-align:center;color:#888;">
            📭 انتظار البيانات...<br>
            <small>اضغط "🧪 اختبار" لإرسال بيانات تجريبية</small>
        </div>
    </div>

    <div class="card">
        <h4>🐞 معلومات التصحيح:</h4>
        <div id="debug" class="debug">في انتظار التحميل...</div>
    </div>

    <script>
        // استخدام الرابط المباشر
        const API_URL = 'http://localhost:3000/api/system-info';

        function log(msg) {
            const debug = document.getElementById('debug');
            debug.textContent += '\n' + new Date().toLocaleTimeString() + ' - ' + msg;
            debug.scrollTop = debug.scrollHeight;
        }

        async function loadData() {
            const status = document.getElementById('status');
            const container = document.getElementById('dataContainer');
            
            status.className = 'status';
            status.textContent = '🔄 جاري التحميل...';
            log('📤 جلب البيانات من: ' + API_URL);

            try {
                const response = await fetch(API_URL);
                log('📥 استجابة: HTTP ' + response.status);

                if (!response.ok) {
                    throw new Error('HTTP ' + response.status);
                }

                const data = await response.json();
                log('✅ تم استلام البيانات بنجاح');
                log('📊 عدد الحقول: ' + Object.keys(data).length);

                status.className = 'status online';
                status.textContent = '✅ متصل';

                // عرض البيانات
                if (!data || data.username === 'في انتظار البيانات' || data.message) {
                    container.innerHTML = `
                        <div class="card" style="text-align:center;color:#888;">
                            📭 لا توجد بيانات حقيقية<br>
                            <small>اضغط "🧪 اختبار" لإرسال بيانات تجريبية</small>
                        </div>
                    `;
                    return;
                }

                let html = '<div class="grid">';
                const fields = [
                    ['👤 المستخدم', 'username'],
                    ['💻 الجهاز', 'pc_name'],
                    ['🖥️ نظام التشغيل', 'os'],
                    ['⚙️ المعالج', 'cpu'],
                    ['💾 الرام', 'ram'],
                    ['🌐 MAC', 'mac'],
                    ['🌍 IP العام', 'public_ip'],
                    ['🆔 HWID', 'hwid'],
                    ['🎭 VM', 'is_vm']
                ];

                for (const [label, key] of fields) {
                    let val = data[key];
                    if (val === undefined || val === null) val = 'غير متوفر';
                    if (key === 'is_vm') {
                        val = val ? '✅ نعم' : '❌ لا';
                    }
                    html += `
                        <div class="item">
                            <div class="label">${label}</div>
                            <div class="value">${val}</div>
                        </div>
                    `;
                }
                html += '</div>';

                if (data.received_at) {
                    html += `<p style="text-align:center;color:#666;font-size:12px;">🕐 ${new Date(data.received_at).toLocaleString('ar-EG')}</p>`;
                }

                container.innerHTML = html;

            } catch (err) {
                log('❌ خطأ: ' + err.message);
                status.className = 'status offline';
                status.textContent = '⛔ غير متصل - ' + err.message;
                container.innerHTML = `
                    <div class="card" style="border-color:#ff5252;text-align:center;">
                        <h3 style="color:#ff5252;">❌ فشل الاتصال</h3>
                        <p style="color:#888;">${err.message}</p>
                        <p style="color:#666;font-size:13px;">
                            🔧 تأكد من:<br>
                            1. السيرفر يعمل: <code>npm start</code><br>
                            2. افتح: <a href="/test" style="color:#00e676;" target="_blank">/test</a><br>
                            3. افتح: <a href="/api/system-info" style="color:#00e676;" target="_blank">/api/system-info</a>
                        </p>
                    </div>
                `;
            }
        }

        async function sendTest() {
            const testData = {
                username: "Test_User_" + Math.floor(Math.random() * 1000),
                pc_name: "DESKTOP-TEST",
                os: "Windows 10 Pro",
                cpu: "Intel Core i7-10700K",
                ram: "32768 MB",
                mac: "AA-BB-CC-DD-EE-FF",
                public_ip: "192.168.1." + Math.floor(Math.random() * 255),
                hwid: "S-1-5-21-TEST-" + Date.now(),
                is_vm: false
            };

            log('📤 إرسال بيانات اختبار: ' + JSON.stringify(testData));

            try {
                const token = document.getElementById('tokenInput').value;
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': token
                    },
                    body: JSON.stringify(testData)
                });

                log('📥 استجابة الإرسال: HTTP ' + response.status);

                if (response.ok) {
                    alert('✅ تم إرسال بيانات اختبار بنجاح!');
                    loadData();
                } else {
                    const err = await response.json();
                    alert('❌ فشل الإرسال: ' + (err.error || response.status));
                    log('❌ فشل الإرسال: ' + response.status);
                }
            } catch (err) {
                alert('❌ خطأ: ' + err.message);
                log('❌ خطأ في الإرسال: ' + err.message);
            }
        }

        async function clearData() {
            if (!confirm('مسح البيانات؟')) return;
            try {
                const token = document.getElementById('tokenInput').value;
                const response = await fetch(API_URL, {
                    method: 'DELETE',
                    headers: { 'Authorization': token }
                });
                if (response.ok) {
                    alert('✅ تم المسح');
                    loadData();
                }
            } catch (err) {
                alert('❌ خطأ: ' + err.message);
            }
        }

        // تحميل عند فتح الصفحة
        log('🚀 بدء التحميل...');
        loadData();

        // تحديث كل 10 ثواني
        setInterval(loadData, 10000);
    </script>
</body>
</html>
